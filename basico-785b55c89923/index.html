<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A5F">
<title>Calendário de Maria 2027 · Área da cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito+Sans:wght@400;600;700;800&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F3A5F;--navy-d:#16294A;--navy-l:#E3EAF3;
  --cream:#FBF7EF;--sand:#F2ECE0;--paper:#FFFDF8;
  --gold:#B08A3E;--gold-l:#D8C08A;--gold-t:#7A5A23;
  --ink:#2A2F3A;--muted:#5B6170;--line:#E7D9BC;
  --green:#15803D;--green-d:#116932;--red:#B91C1C;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Nunito Sans',system-ui,sans-serif;--script:'Pinyon Script',cursive;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--navy)}

/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 16px rgba(22,41,74,.25)}
.brand small{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#E4C98F}
.brand b{display:block;font-family:var(--serif);font-size:22px;line-height:1.1}
.plan{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:5px 10px;white-space:nowrap}

/* navegação */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(31,58,95,.08)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;min-height:56px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--navy);background:var(--navy-l)}
@media (min-width:900px){
  body{padding-bottom:0}
  .tabs{position:sticky;top:62px;bottom:auto;display:flex;justify-content:center;gap:6px;border-top:0;border-bottom:1px solid var(--line);box-shadow:none;padding:8px}
  .tab{flex-direction:row;gap:8px;font-size:15px;padding:8px 16px;min-height:44px}
}

main{max-width:760px;margin:0 auto;padding:20px 16px 32px}
h1,h2,h3{font-family:var(--serif);color:var(--navy);margin:0;line-height:1.1}
h1{font-size:34px}h2{font-size:28px}h3{font-size:22px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-t)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.card.navy h2,.card.navy h3{color:#fff}
.card.navy .eyebrow{color:#E4C98F}
.muted{color:var(--muted)}
.quote{font-family:var(--serif);font-size:23px;font-style:italic;line-height:1.3;color:var(--navy)}
.big{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 10px;background:var(--navy-l);color:var(--navy)}
.tag.gold{background:#F6EBD3;color:var(--gold-t)}
.tag.green{background:#DCFCE7;color:#14532D}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:999px;border:0;background:var(--green);color:#fff;font-weight:800;font-size:16px;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s;text-align:center}
.btn:hover{background:var(--green-d)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.sec:hover{background:var(--navy-l)}
.btn.light{background:#fff;color:var(--navy)}
.btn svg{width:18px;height:18px}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* seletor de mês */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* formulários */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;color:var(--navy)}
textarea,select,input[type=text]{width:100%;border:1px solid var(--gold-l);border-radius:12px;background:#fff;padding:12px;font-size:16px;line-height:1.5}
textarea{min-height:110px;resize:vertical;background-image:repeating-linear-gradient(transparent 0 23px,#EFE4CC 23px 24px);background-attachment:local;line-height:24px}
textarea:focus,select:focus,input:focus{outline:2px solid var(--navy);outline-offset:1px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;accent-color:var(--green);flex:none;margin-top:1px}

/* lista de festas */
.festa{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.festa:last-child{border-bottom:0}
.dia{flex:none;width:60px;text-align:center;border-radius:14px;background:var(--navy-l);color:var(--navy);padding:8px 4px}
.dia b{display:block;font-family:var(--serif);font-size:28px;line-height:1}
.dia span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.festa.passou{opacity:.55}
.festa.prox .dia{background:var(--navy);color:#fff}

/* intenções */
.item{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.item.graca{border-color:#86EFAC;background:#F0FDF4}
.item p{margin:0;white-space:pre-wrap}
.mini{border:0;background:none;color:var(--navy);font-weight:700;font-size:14px;padding:8px 6px;cursor:pointer;min-height:40px}
.mini.del{color:var(--red)}

/* cartões */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:12px}
.pc{background:var(--paper);border:2px solid var(--navy);border-radius:14px;padding:16px 14px;text-align:center;display:flex;flex-direction:column;gap:8px;position:relative}
.pc::before{content:"";position:absolute;inset:5px;border:1px solid var(--gold-l);border-radius:10px;pointer-events:none}
.pc b{font-family:var(--serif);font-size:24px;color:var(--navy);line-height:1.1}
.pc p{margin:0;font-size:14px;line-height:1.45}
.pc.sorteado{border-color:var(--green);box-shadow:0 0 0 4px #BBF7D0}
.pc .n{font-size:11px;font-weight:800;color:var(--gold-t);letter-spacing:.1em}

.lock{display:flex;gap:12px;align-items:flex-start}
.lock svg{flex:none;width:26px;height:26px;color:var(--gold-t)}
.sub{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.preview{max-width:520px;margin:0 auto;width:100%}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--navy)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ================= PÁGINAS A4 (prévia e impressão) ================= */
.page{position:relative;width:100%;aspect-ratio:210/297;background:var(--paper);container-type:inline-size;overflow:hidden;box-shadow:0 14px 34px rgba(31,58,95,.16);border-radius:4px;margin:0 auto;color:var(--ink);font-family:var(--sans)}
.page .in{position:absolute;inset:3.4cqw;border:.3cqw solid var(--gold-l);padding:4.6cqw 5.6cqw 3.6cqw;display:flex;flex-direction:column;text-align:center}
.page .in::before{content:"";position:absolute;inset:1cqw;border:.12cqw solid var(--gold-l);pointer-events:none}
.page .orn{position:absolute;width:12cqw;height:12cqw;color:var(--gold)}
.page .orn.tl{top:-.4cqw;left:-.4cqw}.page .orn.tr{top:-.4cqw;right:-.4cqw;transform:scaleX(-1)}
.page .orn.bl{bottom:-.4cqw;left:-.4cqw;transform:scaleY(-1)}.page .orn.br{bottom:-.4cqw;right:-.4cqw;transform:scale(-1,-1)}
.p-lbl{font-size:2.1cqw;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-t);font-weight:800}
.p-mes{font-family:var(--serif);font-weight:700;font-size:10cqw;line-height:1;color:var(--navy);margin-top:.8cqw}
.p-mes span{color:var(--gold-t);font-weight:600}
.p-inv{font-family:var(--serif);font-style:italic;font-weight:600;font-size:3.6cqw;margin-top:.6cqw}
.p-art{display:flex;justify-content:center;margin:1.6cqw 0}
.p-art svg{width:24cqw;height:auto}
.p-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:.2cqw solid var(--gold-l);border-top:.2cqw solid var(--gold-l)}
.p-wd{background:var(--navy);color:#fff;font-size:2.2cqw;font-weight:800;letter-spacing:.12em;padding:1.1cqw 0;border-right:.2cqw solid var(--gold-l)}
.p-c{height:7.2cqw;border-right:.2cqw solid var(--line);border-bottom:.2cqw solid var(--line);font-family:var(--serif);font-weight:700;font-size:4.2cqw;line-height:1;text-align:left;padding:.9cqw 1.2cqw;position:relative}
.p-c.sun{color:var(--gold-t)}
.p-c.fe{background:#F7EEDA}
.p-c.hl{background:var(--navy);color:#fff}
.p-c .st{position:absolute;right:1cqw;bottom:.8cqw;width:2.6cqw;height:2.6cqw;color:var(--gold)}
.p-c.hl .st{color:#E4C98F}
.p-boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6cqw;margin-top:2.2cqw}
.p-bx{border:.2cqw solid var(--gold-l);border-radius:1cqw;padding:1.3cqw 1.2cqw;font-size:2.2cqw;line-height:1.35;text-align:center}
.p-bx b{display:block;font-family:var(--serif);font-size:3cqw;color:var(--navy);margin-bottom:.4cqw}
.p-fr{margin-top:auto;padding-top:1.4cqw;font-family:var(--script);font-size:4.8cqw;color:var(--navy);line-height:1.2}
.p-dv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6cqw;margin-top:1.4cqw;text-align:left}
.p-dv .p-bx{text-align:left;font-size:2.3cqw}
.p-dv.grow{flex:1;grid-template-rows:auto auto minmax(0,1fr) minmax(0,1fr)}
.p-dv.grow3{flex:1;grid-template-rows:repeat(3,minmax(0,1fr))}
.p-dv .p-bx i{font-family:var(--serif);font-size:2.9cqw;line-height:1.3;display:block}
.p-w{border:.2cqw solid var(--gold-l);border-radius:1cqw;padding:1.3cqw 1.4cqw;text-align:left;display:flex;flex-direction:column}
.p-w b{font-family:var(--serif);font-size:3cqw;color:var(--navy)}
.p-lines{flex:1;min-height:12cqw;font-size:2.4cqw;line-height:4cqw;background-image:repeating-linear-gradient(transparent 0 3.85cqw,#E3D6BF 3.85cqw 4cqw);white-space:pre-wrap;overflow:hidden}
.p-chk{display:flex;gap:1cqw;align-items:center;margin-top:.6cqw;font-size:2.2cqw}
.p-chk i{flex:none;width:2.2cqw;height:2.2cqw;border:.2cqw solid var(--gold);font-style:normal;font-size:2cqw;line-height:1.8cqw;text-align:center;color:var(--navy);font-weight:800}
.p-title{font-family:var(--serif);font-weight:700;font-size:7cqw;line-height:1.05;color:var(--navy)}
.p-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:2cqw;flex:1;margin-top:1.4cqw}
.p-card{border:.5cqw solid var(--navy);border-radius:1.6cqw;padding:2cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;position:relative;text-align:center}
.p-card::before{content:"";position:absolute;inset:.8cqw;border:.15cqw solid var(--gold-l);border-radius:1cqw}
.p-card b{font-family:var(--serif);font-size:4.6cqw;color:var(--navy);line-height:1.05}
.p-card p{margin:0;font-size:2.3cqw;line-height:1.4}
.p-card small{font-size:1.6cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-t);font-weight:800}
.p-list{text-align:left;font-size:2.4cqw;line-height:1.45}
.p-list .p-fe{display:flex;gap:2cqw;padding:1cqw 0;border-bottom:.15cqw solid var(--line)}
.p-list .p-fe b{flex:none;width:15cqw;font-family:var(--serif);font-size:3cqw;color:var(--navy)}
.page.flow{aspect-ratio:auto}
.page.flow .in{position:relative;inset:auto;margin:3.4cqw;min-height:134cqw}

/* versão econômica: pouca tinta */
.econ .page{background:#fff;box-shadow:none;border:1px solid #ddd}
.econ .page .in,.econ .p-bx,.econ .p-w,.econ .p-grid,.econ .p-wd,.econ .p-c{border-color:#9a9a9a!important}
.econ .page .in::before{border-color:#bdbdbd}
.econ .p-wd{background:#fff;color:#222;border-bottom:.2cqw solid #9a9a9a}
.econ .p-c.hl{background:#fff;color:#111;box-shadow:inset 0 0 0 .5cqw #555}
.econ .p-c.fe{background:#fff}
.econ .p-mes,.econ .p-bx b,.econ .p-w b,.econ .p-fr,.econ .p-title,.econ .p-card b{color:#222}
.econ .p-card{border-color:#555}
.econ .p-art svg *{fill:none!important;stroke:#6b6b6b!important;stroke-width:1.1!important}
.econ .orn{color:#9a9a9a}
.econ .p-lines{background-image:repeating-linear-gradient(transparent 0 3.85cqw,#cfcfcf 3.85cqw 4cqw)}

#print-area{display:none}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  #print-area .page{width:210mm;height:297mm;aspect-ratio:auto;box-shadow:none;border-radius:0;border:0;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-area .page.flow{height:auto;min-height:297mm}
  #print-area .page:last-child{break-after:auto;page-break-after:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main id="app" tabindex="-1"></main>

}

  } else if (state.sub === 'econ') {
    corpo = '<div class="card"><span class="eyebrow">Bônus 3</span><h2>Versão econômica para impressão</h2><p style="margin:0">Mesmas páginas, com fundo branco, sem áreas coloridas e com a ilustração só em traço. Ideal para imprimir em casa gastando bem menos tinta.</p>' +
      '<div class="row"><button class="btn" data-act="print-cal-econ">' + ico('print') + 'Calendário econômico (12 meses)</button><button class="btn sec" data-act="print-dev-econ">' + ico('print') + 'Devocionais econômicos</button></div></div>' +
      '<div class="preview econ">' + paginaCalendario(state.mes) + '</div>';
  } else {
    corpo = '<div class="card"><span class="eyebrow">Bônus 4</span><h2>Comunidade Ponto da Fé</h2><p style="margin:0">Um cantinho para partilhar a fé com outras pessoas que amam Nossa Senhora: mensagens, orações, reflexões e inspiração para o dia a dia.</p>' +
      (CONFIG.linkComunidade
        ? '<div class="row"><a class="btn" href="' + esc(CONFIG.linkComunidade) + '" target="_blank" rel="noopener">Entrar na comunidade</a></div>'
        : '<p class="muted" style="margin:0">O link de entrada será enviado para o seu e-mail de compra.</p>') + '</div>';
  }
  return '<div class="stack"><div><span class="eyebrow">Seus bônus</span><h1>Bônus do Plano Completo</h1></div>' + nav + corpo + '</div>';
}

const VIEWS = { hoje: viewHoje, calendario: viewCalendario, devocional: viewDevocional, festas: viewFestas, intencoes: viewIntencoes, bonus: viewBonus };
function render(rolar) {
  if (!VIEWS[state.view]) state.view = 'hoje';
  $('#tabs').innerHTML = TABS.map((t) => '<button class="tab" data-go="' + t[0] + '"' + (state.view === t[0] ? ' aria-current="page"' : '') + '>' + ico(t[0]) + '<span>' + t[1] + '</span></button>').join('');
  $('#app').innerHTML = VIEWS[state.view]();
  store.set('view', state.view); store.set('mes', state.mes);
  if (rolar) { window.scrollTo(0, 0); }
  const ativo = document.querySelector('.chips .chip[aria-pressed="true"]');
  if (ativo && ativo.scrollIntoView) ativo.scrollIntoView({ block: 'nearest', inline: 'center' });
}

/* ---------- eventos ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('button');
  if (!el) return;
  const d = el.dataset;
  if (d.go) { state.view = d.go; if (d.sub) state.sub = d.sub; if (d.mes != null) state.mes = +d.mes; state.prev = false; render(true); $('#app').focus({ preventScroll: true }); return; }
  if (d.mes != null) { state.mes = +d.mes; state.prev = false; render(false); return; }
  if (d.sub) { state.sub = d.sub; render(false); return; }
  if (d.filtro) { state.filtro = d.filtro; render(false); return; }
  if (d.graca) { const its = store.get('intencoes', []); const it = its.find((x) => x.id === d.graca); if (it) { it.graca = !it.graca; store.set('intencoes', its); toast(it.graca ? 'Graças a Deus! Graça marcada.' : 'Marcação removida.'); } render(false); return; }
  if (d.del) { if (confirm('Apagar esta intenção?')) { store.set('intencoes', store.get('intencoes', []).filter((x) => x.id !== d.del)); render(false); } return; }
  switch (d.act) {
    case 'print-cal': imprimir(paginaCalendario(state.mes), state.econ); break;
    case 'print-cal-all': imprimir(MESES.map((m, i) => paginaCalendario(i)).join(''), state.econ); break;
    case 'print-dev': imprimir(paginaDevocional(state.mes), false); break;
    case 'print-dev-all': imprimir(MESES.map((m, i) => paginaDevocional(i)).join(''), false); break;
    case 'print-cal-econ': imprimir(MESES.map((m, i) => paginaCalendario(i)).join(''), true); break;
    case 'print-dev-econ': imprimir(MESES.map((m, i) => paginaDevocional(i)).join(''), true); break;
    case 'print-festas': imprimir(paginaFestas(), false); break;
    case 'print-cartoes': imprimir(paginasCartoes(), false); break;
    case 'print-prep': imprimir(paginasPreparando(), false); break;
    case 'print-int': imprimir(paginaIntencoes(store.get('intencoes', [])), false); break;
    case 'print-branco': imprimir(paginasEmBranco(), false); break;
    case 'prev': state.prev = !state.prev; render(false); break;
    case 'sortear': { let n; do { n = Math.floor(Math.random() * CARTOES.length); } while (n === state.sorteado && CARTOES.length > 1); state.sorteado = n; render(false); break; }
    case 'add-int': {
      const tx = $('#int-texto').value.trim();
      if (!tx) { toast('Escreva sua intenção antes de guardar.'); $('#int-texto').focus(); return; }
      const t = hoje();
      const its = store.get('intencoes', []);
      its.unshift({ id: String(Date.now()), tipo: $('#int-tipo').value, texto: tx, data: String(t.d).padStart(2, '0') + '/' + String(t.m).padStart(2, '0') + '/' + t.y, graca: false });
      store.set('intencoes', its); state.filtro = 'todas'; toast('Intenção guardada no seu caderno.'); render(false); break;
    }
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.act === 'econ') { state.econ = el.checked; render(false); return; }
  if (el.dataset.k && el.type === 'checkbox') store.set(el.dataset.k, el.checked);
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.k && el.tagName === 'TEXTAREA') store.set(el.dataset.k, el.value);
});

$('#plan-badge').textContent = COMPLETO ? 'Plano Completo' : 'Plano Básico';
render(false);
})();
</script>
</body>
</html>
